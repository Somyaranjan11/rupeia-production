<!DOCTYPE html>
<html>
  <head>
    <title>Signature Pad Upload</title>
    <style>
      canvas {
        border: 2px solid black;
        touch-action: none;
      }
      button {
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Draw your signature</h2>
    <canvas id="signature" width="400" height="200"></canvas><br />
    <button onclick="clearCanvas()">Clear</button>
    <button onclick="uploadSignature()">Upload</button>
    <button onclick="uploadAadhar()">Upload Aadhar</button>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.6/dist/signature_pad.umd.min.js"></script>
    <script>
      const canvas = document.getElementById("signature");
      const signaturePad = new SignaturePad(canvas);

      async function uploadAadhar() {
        const redirectUrl = "https://s.finprim.com/v2/identity_documents/iddoc_b5cba0ec20bd4718976fddf5c7373b37";
    console.log("🔗 Redirecting to Aadhaar flow:", redirectUrl);
    window.location.href = redirectUrl;
    return;
        const kyc_id = "kycr_acc1604aa33949b58a1f9cefe85103f3";
        const token =
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY4OTE3Y2M2NGZjNDlmODRhNzZmMWFhNiIsImlhdCI6MTc1NTI4MTM0MCwiZXhwIjoxNzYzMDU3MzQwfQ.vXvaBN1I2Q1ad38m4Cmutio_TT4f-lVcwSVio5Tiloo";

        try {
          const response = await fetch(
            "https://onboarding.rupeia.com/api/v2/docs/identity_documents",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`, // ✅ add bearer token
              },
              body: JSON.stringify({
                kyc_request: kyc_id,
                type: "aadhaar",
                postback_url: "https://fintechprimitives.com",
              }),
            }
          );

          const data = await response.json();
          console.log("✅ API Response:", data);

          if (!response.ok) {
            console.error("❌ Upload failed:", data);
            alert(
              data?.message || "Something went wrong while uploading Aadhaar"
            );
          } else {
            // ✅ Redirect user to redirect_url
            if (data?.fetch?.redirect_url) {
              console.log("🔗 Redirecting to:", data.fetch.redirect_url);
              window.location.href = data.fetch.redirect_url;
            } else {
              alert("Aadhaar uploaded but no redirect URL found.");
            }
          }
        } catch (err) {
          console.error("❌ Network error:", err);
          alert("Network error while uploading Aadhaar");
        }
      }

      function clearCanvas() {
        signaturePad.clear();
      }
      function getKycIdFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get("kyc_id");
      }

      async function uploadSignature() {
        if (signaturePad.isEmpty()) {
          alert("Please sign first!");
          return;
        }
        const kyc_id = getKycIdFromURL();
        if (!kyc_id) {
          alert("Missing KYC ID in URL!");
          return;
        }

        const blob = await (
          await fetch(signaturePad.toDataURL("image/png"))
        ).blob();
        const fileName = `${kyc_id}.png`;
        console.log("hua");

        //   // Step 1: Get pre-signed URL
        const res = await fetch(
          `https://onboarding.rupeia.com/api/v2/s3/upload?fileName=${fileName}`
        );

        const { url } = await res.json();

        //   // Step 2: Upload directly to S3
        await fetch(url, {
          method: "PUT",
          headers: { "Content-Type": "image/jpeg" },
          body: blob,
        });

        const notifyRes = await fetch(
          "https://onboarding.rupeia.com/api/v2/files/sign_upload",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ kyc_req: kyc_id }),
          }
        );

        const notifyResJson = await notifyRes.json(); // <-- This gets the JSON response
        console.log("Response from /sign_upload:", notifyResJson); // <-- Logs it to browser console

        if (notifyRes.ok) {
          alert("Signature uploaded and backend notified!");
        } else {
          alert("Signature uploaded, but failed to notify backend.");
        }

        alert("Signature uploaded to S3!");
      }
    </script>
  </body>
</html>
